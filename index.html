<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>成語圖像小挑戰</title>
  <style>
    :root {
      --blue: #4c9cff;
      --dark-blue: #2467b8;
      --yellow: #ffd65a;
      --orange: #ff9b54;
      --green: #51c59c;
      --red: #ef6170;
      --ink: #27354a;
      --bg: #eaf7ff;
      --card: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 10%, #fff2a9 0 7%, transparent 7.5%),
        radial-gradient(circle at 86% 12%, #bfeeff 0 9%, transparent 9.5%),
        linear-gradient(180deg, #cceeff 0%, #edfaff 45%, #fff8df 100%);
    }

    .app {
      width: min(1050px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 42px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mascot {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      font-size: 38px;
      background: linear-gradient(135deg, #ffe37e, #ffb85a);
      box-shadow: 0 5px 0 #e79b35;
      transform: rotate(-3deg);
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 36px);
      color: var(--dark-blue);
      letter-spacing: 1px;
    }

    .subtitle {
      margin: 5px 0 0;
      font-weight: 700;
      color: #55718c;
    }

    .score-box {
      min-width: 142px;
      padding: 12px 16px;
      text-align: center;
      border: 3px solid #b6e4ff;
      border-radius: 18px;
      background: rgba(255,255,255,.86);
      font-weight: 800;
      box-shadow: 0 4px 0 #b6e4ff;
    }

    .score-number {
      color: #ee7d24;
      font-size: 25px;
    }

    .lesson-menu {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .lesson-btn, .choice, .action-btn {
      border: 0;
      cursor: pointer;
      font-family: inherit;
      font-weight: 800;
      transition: transform .15s, box-shadow .15s, background .15s;
    }

    .lesson-btn {
      min-height: 48px;
      padding: 8px;
      color: #315a7d;
      background: white;
      border: 2px solid #c9e9fb;
      border-radius: 14px;
      font-size: 15px;
    }

    /* 手機瀏覽器會把 :hover 保留在最後點選的按鈕上，因此只在有滑鼠的裝置啟用。 */
    @media (hover: hover) {
      .lesson-btn:hover, .choice:hover, .action-btn:hover {
        transform: translateY(-2px);
      }
    }

    .lesson-btn.active {
      color: white;
      background: var(--blue);
      border-color: var(--blue);
      box-shadow: 0 4px 0 var(--dark-blue);
    }

    .quiz-card {
      overflow: hidden;
      background: rgba(255,255,255,.95);
      border: 3px solid #d3edf9;
      border-radius: 28px;
      box-shadow: 0 10px 25px rgba(48, 116, 160, .13);
    }

    .progress-area {
      padding: 16px 22px 10px;
      background: #f7fcff;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-weight: 800;
      color: #54718b;
    }

    .progress-track {
      height: 13px;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 99px;
      background: #dceef8;
    }

    .progress-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #5fc5ff, #59d59b);
      transition: width .35s ease;
    }

    .quiz-content {
      display: grid;
      grid-template-columns: minmax(280px, .9fr) minmax(300px, 1.1fr);
      gap: 26px;
      align-items: center;
      padding: 25px;
    }

    .scene {
      position: relative;
      min-height: 310px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      border: 4px solid #c4e8ff;
      background: linear-gradient(180deg, #9ee1ff 0%, #d8f5ff 62%, #bde89d 63%, #8fcf75 100%);
    }

    .cloud {
      position: absolute;
      color: white;
      opacity: .9;
      font-size: 42px;
      top: 18px;
    }

    .cloud.left { left: 20px; }
    .cloud.right { right: 20px; top: 65px; font-size: 31px; }

    .scene-art {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      padding: 14px;
      display: grid;
      place-items: center;
    }

    .scene-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      transform: scale(var(--art-scale, 1));
      transform-origin: center;
      transition: transform .2s ease;
      filter: drop-shadow(0 7px 5px rgba(39, 104, 74, .18));
    }

    .image-controls {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 12px;
      color: #55718c;
      font-size: 14px;
      font-weight: 800;
    }

    .image-controls input { accent-color: var(--blue); flex: 1; }

    .question-label {
      display: inline-block;
      margin-bottom: 9px;
      color: #e5761a;
      font-weight: 900;
      font-size: 17px;
    }

    .question {
      margin: 0 0 18px;
      color: #224d78;
      font-size: clamp(24px, 3.2vw, 32px);
      line-height: 1.35;
    }

    .instruction {
      margin: -8px 0 18px;
      color: #6e8497;
      font-weight: 700;
    }

    .choices {
      display: grid;
      gap: 11px;
    }

    .choice {
      width: 100%;
      padding: 15px 16px;
      text-align: left;
      color: #34516b;
      background: #fff;
      border: 2px solid #d7e9f5;
      border-radius: 15px;
      font-size: 18px;
    }

    @media (hover: hover) {
      .choice:hover { background: #f0f9ff; border-color: #81c8f5; }
    }

    /* 保留鍵盤操作的焦點提示，避免觸控後留下系統的藍色點按框。 */
    .lesson-btn, .choice, .action-btn { -webkit-tap-highlight-color: transparent; }
    .lesson-btn:focus:not(:focus-visible),
    .choice:focus:not(:focus-visible),
    .action-btn:focus:not(:focus-visible) { outline: none; }
    .lesson-btn:focus-visible,
    .choice:focus-visible,
    .action-btn:focus-visible { outline: 3px solid #2467b8; outline-offset: 3px; }

    .choice.correct {
      color: #147551;
      background: #dff9e9;
      border-color: #54c68f;
    }

    .choice.wrong {
      color: #ad3b48;
      background: #ffe5e8;
      border-color: #ef8791;
      animation: shake .28s linear;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      75% { transform: translateX(7px); }
    }

    .hint {
      display: none;
      margin-top: 17px;
      padding: 15px;
      border: 2px dashed #ffb04f;
      border-radius: 15px;
      background: #fff8df;
      color: #855211;
      line-height: 1.65;
      font-weight: 700;
    }

    .hint.show { display: block; }

    .result {
      display: none;
      padding: 48px 22px;
      text-align: center;
    }

    .result.show { display: block; }

    .result-icon { font-size: 82px; }

    .result h2 {
      margin: 8px 0;
      color: var(--dark-blue);
      font-size: 34px;
    }

    .result p {
      margin: 0 0 21px;
      color: #52708d;
      font-size: 19px;
      font-weight: 700;
    }

    .action-btn {
      padding: 14px 22px;
      color: white;
      background: linear-gradient(180deg, #5dc0ff, #348de2);
      border-radius: 15px;
      box-shadow: 0 4px 0 #236eaf;
      font-size: 18px;
    }

    .action-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #236eaf; }

    .footer-note {
      margin: 16px 0 0;
      text-align: center;
      color: #638198;
      font-size: 14px;
      font-weight: 700;
    }

    @media (max-width: 780px) {
      header { align-items: flex-start; }
      .score-box { min-width: 105px; }
      .lesson-menu { grid-template-columns: repeat(3, 1fr); }
      .lesson-menu .lesson-btn:last-child { grid-column: span 3; }
      .quiz-content { grid-template-columns: 1fr; padding: 16px; }
      .scene { min-height: 230px; }
    }

    @media (max-width: 460px) {
      .app { width: min(100% - 16px, 1050px); }
      header { gap: 8px; }
      .mascot { width: 50px; height: 50px; font-size: 30px; }
      .subtitle { font-size: 13px; }
      .score-box { padding: 9px; font-size: 13px; }
      .lesson-menu { gap: 6px; }
      .lesson-btn { font-size: 14px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="mascot">🦉</div>
        <div>
          <h1>成語圖像小挑戰</h1>
          <p class="subtitle">看圖選成語，答錯也別怕！提示會幫助你再試一次。</p>
        </div>
      </div>
      <div class="score-box">
        得分<br>
        <span class="score-number" id="score">0</span>
        <span id="scoreTotal">/ 9</span>
      </div>
    </header>

    <nav class="lesson-menu" id="lessonMenu"></nav>

    <section class="quiz-card">
      <div id="quizArea">
        <div class="progress-area">
          <div class="progress-info">
            <span id="lessonTitle">第一課</span>
            <span id="progressText">第 1 題 / 共 9 題</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>

        <div class="quiz-content">
          <div class="scene" aria-label="成語情境插圖">
            <span class="cloud left">☁️</span>
            <span class="cloud right">☁️</span>
            <div class="scene-art">
              <img class="scene-image" id="sceneImage" alt="成語情境插圖" />
            </div>
          </div>

          <div>
            <span class="question-label">看圖完成成語填充題</span>
            <h2 class="question">請選出最適合填入句子的成語。</h2>
            <p class="instruction">仔細讀題，再參考插圖選出答案。</p>
            <div class="choices" id="choices"></div>
            <div class="hint" id="hint"></div>
            <label class="image-controls" for="imageScale">插圖大小
              <input id="imageScale" type="range" min="75" max="130" value="100" aria-label="調整插圖大小" />
              <span id="imageScaleValue">100%</span>
            </label>
          </div>
        </div>
      </div>

      <div class="result" id="resultArea">
        <div class="result-icon">🏆</div>
        <h2 id="resultTitle">挑戰完成！</h2>
        <p id="resultText"></p>
        <button class="action-btn" id="retryBtn">再測驗一次</button>
      </div>
    </section>

    <p class="footer-note">每次開始測驗時，題目與選項順序都會重新隨機排列。</p>
  </main>

  <script>
    const lessons = [
      {
        name: "第一課",
        items: [
          ["全力以赴","用全部的力量去做一件事。","🏃‍♀️💨🏁","小美為了接力賽，全力衝向終點。"],

          ["喜不自禁","高興得控制不住自己的情緒。","🥳🎁🤗","小安得到期待很久的禮物，高興得跳了起來。"],
          ["大聲疾呼","大聲急切地呼喊，希望大家注意。","📣🚸👧👦","看見同學靠近危險地方，小明趕緊大聲提醒。"],
          ["死灰復燃","已經消失的事物又重新出現。","🔥🪵😮","已經撲滅的火堆，又冒出了火苗。"],
          ["碩果僅存","經過淘汰或變化後，僅剩下少數珍貴的事物。","🌳🍎✨","果園收成後，只剩下一顆最珍貴的蘋果。"],
          ["集思廣益","集合大家的想法，讓事情做得更好。","👧💡👦💡👧","全班圍在一起討論園遊會的好點子。"],
          ["寄人籬下","依靠別人生活，沒有自己的依靠。","🏠🧳😔","小男孩暫時住在親戚家，需要依靠別人照顧。"],
          ["赴湯蹈火","不怕危險，勇敢地去做事情。","🧑‍🚒🔥🚒","消防員不怕危險，勇敢進入火場救人。"]
        ]
      },
      {
        name: "第二課",

          ["哀鴻遍野","到處都是受苦受難、無家可歸的人。","🌧️🏚️😢","風災過後，許多人失去家園，等待幫助。"],
          ["抱殘守缺","守著舊有的東西，不願意改變或接受新事物。","📻🔒💻","爺爺只想使用壞掉的老收音機，不願試試新工具。"],
          ["同流合污","跟壞人一起做壞事。","😈🤝😈","小明本來知道不對，卻跟著同學欺負別人。"],
          ["當機立斷","遇到事情時，能夠立刻做出決定。","🚦🤔➡️","遇到緊急情況，隊長立刻決定帶大家離開。"]
        ]
      },
      {
        name: "第三課",

          ["疾風勁草","經過困難考驗，才能看出一個人的堅強。","💨🌿⛈️","強風吹過後，堅韌的小草依然挺立著。"],
          ["隱惡揚善","隱藏別人的缺點，宣揚別人的優點。","🤫💖👏","老師不公開小杰的失誤，並稱讚他的努力。"],

          ["適可而止","做事情要適量，到了適當程度就停止。","🍰✋😊","小華很喜歡蛋糕，但吃到適量就停下來。"],

      },
      {
        name: "第四課",

      {

          ["上行下效","上面的人怎麼做，下面的人就跟著模仿。","👩‍🏫➡️👧👦","老師先把垃圾分類，學生也跟著一起做。"],

    const fillQuestions = [
      "哥哥參加馬拉松比賽，即使已經很累了，仍然（　　　　）地衝向終點。",

      "小明雖然多次比賽失利，仍然持續努力練習，展現（　　　　）的精神。",

      "新制度推行後問題不斷，引起民眾（　　　　）。",
      "登山隊在惡劣天氣中依然勇敢前進，展現出（　　　　）的精神。",

      "老師一再叮嚀同學遵守交通規則，可說是（　　　　）。",
      "去年的畢業旅行情景至今仍清楚浮現在眼前，令人覺得（　　　　）。",
      "教練臨時改變戰術，讓對手措手不及，成功（　　　　）。",
      "那群惡霸喜歡欺負弱小，行為十分（　　　　）。",
      "小婷經過多年努力，終於從眾多參賽者中（　　　　）。",
      "這篇作文已經非常出色了，但小華仍反覆修改，真是（　　　　）。",
      "老師經常引用歷史故事和名人名言來說明道理，可說是（　　　　）。",
      "維護教室整潔是每位同學的責任，大家都（　　　　）。",
      "一個人想完成大型活動十分困難，因為（　　　　）。",
      "經過半年的努力，班上的閱讀風氣越來越好，可說是（　　　　）。",
      "校長做事認真守規矩，老師和學生也紛紛效法，這正是（　　　　）。",
      "只根據外表就判斷一個人的能力，是一種（　　　　）的行為。"
    ];

    let fillQuestionIndex = 0;
    const allItems = lessons.flatMap(lesson =>
      lesson.items.map(item => ({
        idiom: item[0],
        meaning: item[1],
        scene: item[2],
        example: item[3],
        prompt: fillQuestions[fillQuestionIndex++],
        lesson: lesson.name
      }))
    );

    let selectedLesson = 0;
    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let alreadyAnswered = false;

    const lessonMenu = document.getElementById("lessonMenu");
    const scoreEl = document.getElementById("score");
    const scoreTotalEl = document.getElementById("scoreTotal");
    const lessonTitle = document.getElementById("lessonTitle");
    const progressText = document.getElementById("progressText");
    const progressFill = document.getElementById("progressFill");
    const sceneImage = document.getElementById("sceneImage");
    const imageScale = document.getElementById("imageScale");
    const imageScaleValue = document.getElementById("imageScaleValue");
    const choicesEl = document.getElementById("choices");
    const hintEl = document.getElementById("hint");
    const quizArea = document.getElementById("quizArea");
    const resultArea = document.getElementById("resultArea");
    const resultTitle = document.getElementById("resultTitle");
    const resultText = document.getElementById("resultText");
    const retryBtn = document.getElementById("retryBtn");

    // 壓縮檔中的檔名和成語完全對應；唯一例外是「同流合汙」採用舊字形。
    const imageFileNames = { "同流合污": "同流合汙.png" };

    function imagePath(idiom) {
      return `images/${encodeURIComponent(imageFileNames[idiom] || `${idiom}.png`)}`;
    }

    function shuffle(array) {
      const copied = [...array];
      for (let i = copied.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copied[i], copied[j]] = [copied[j], copied[i]];
      }
      return copied;
    }

    function renderLessonMenu() {
      lessonMenu.innerHTML = "";

      lessons.forEach((lesson, index) => {
        const button = document.createElement("button");
        button.className = `lesson-btn ${index === selectedLesson ? "active" : ""}`;
        button.textContent = lesson.name;
        button.addEventListener("click", () => {
          selectedLesson = index;
          startQuiz();
        });
        lessonMenu.appendChild(button);
      });

      const allButton = document.createElement("button");
      allButton.className = `lesson-btn ${selectedLesson === -1 ? "active" : ""}`;
      allButton.textContent = "全部 46 題";
      allButton.addEventListener("click", () => {
        selectedLesson = -1;
        startQuiz();
      });
      lessonMenu.appendChild(allButton);
    }

    function buildQuestions(items) {
      return shuffle(items).map(question => {
        const wrongChoices = shuffle(
          allItems.filter(item => item.idiom !== question.idiom)
        ).slice(0, 3);

        return {
          ...question,
          options: shuffle([question, ...wrongChoices])
        };
      });
    }

    function startQuiz() {
      const sourceItems = selectedLesson === -1
        ? allItems
        : allItems.filter(item => item.lesson === lessons[selectedLesson].name);

      questions = buildQuestions(sourceItems);
      currentIndex = 0;
      score = 0;
      renderLessonMenu();
      quizArea.style.display = "block";
      resultArea.classList.remove("show");
      updateQuestion();
    }

    function updateQuestion() {
      alreadyAnswered = false;
      const question = questions[currentIndex];
      const total = questions.length;

      scoreEl.textContent = score;
      scoreTotalEl.textContent = `/ ${total}`;
      lessonTitle.textContent = selectedLesson === -1 ? "全部成語挑戰" : lessons[selectedLesson].name;
      progressText.textContent = `第 ${currentIndex + 1} 題 / 共 ${total} 題`;
      progressFill.style.width = `${(currentIndex / total) * 100}%`;

      sceneImage.src = imagePath(question.idiom);
      sceneImage.alt = `${question.idiom} 的情境插圖`;
      imageScale.value = 100;
      imageScaleValue.textContent = "100%";
      document.documentElement.style.setProperty("--art-scale", "1");
      document.querySelector(".question").textContent = question.prompt;
      hintEl.className = "hint";
      hintEl.innerHTML = "";

      choicesEl.innerHTML = "";
      question.options.forEach((option) => {
        const button = document.createElement("button");
        button.className = "choice";
        button.textContent = option.idiom;
        button.addEventListener("click", (event) => {
          // event.detail 為 0 表示鍵盤操作，保留鍵盤焦點；觸控／滑鼠則移除焦點。
          if (event.detail !== 0) button.blur();
          checkAnswer(button, option.idiom);
        });
        choicesEl.appendChild(button);
      });
    }

    function checkAnswer(button, chosenIdiom) {
      if (alreadyAnswered) return;

      const question = questions[currentIndex];

      if (chosenIdiom === question.idiom) {
        alreadyAnswered = true;
        score++;
        scoreEl.textContent = score;
        button.classList.add("correct");

        setTimeout(() => {
          currentIndex++;
          if (currentIndex < questions.length) {
            updateQuestion();
          } else {
            showResult();
          }
        }, 700);

      } else {
        button.classList.remove("wrong");
        void button.offsetWidth;
        button.classList.add("wrong");

        hintEl.innerHTML = `
          <strong>💡 小提示：</strong>${question.idiom} 的意思是「${question.meaning}」<br>
          <span style="font-size: 14px;">生活例子：${question.example}</span>
        `;
        hintEl.classList.add("show");
      }
    }

    function showResult() {
      quizArea.style.display = "none";
      resultArea.classList.add("show");
      progressFill.style.width = "100%";

      const total = questions.length;
      resultTitle.textContent = score === total ? "太厲害了，全部答對！" : "挑戰完成！";
      resultText.textContent = `你答對了 ${score} 題，共 ${total} 題。再玩一次，讓成語記得更牢！`;
    }

    retryBtn.addEventListener("click", startQuiz);
    imageScale.addEventListener("input", () => {
      const scale = imageScale.value / 100;
      document.documentElement.style.setProperty("--art-scale", scale);
      imageScaleValue.textContent = `${imageScale.value}%`;
    });

    startQuiz();
  </script>
